[project]
name = "praxis-orchestrator"
version = "0.1.0"
description = "Local-first, human-gated, verified multi-agent coding orchestrator"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "praxis-orchestrator contributors" }]
keywords = ["ai", "agents", "orchestration", "code-generation", "cli"]
classifiers = [
    # Preview, not production: the runtime is unsandboxed and the API's auth is
    # a single shared token. SECURITY.md states the posture plainly.
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
    "Environment :: Console",
]
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "gitpython>=3.1",
    "click>=8.1",
    "structlog>=24.0",
    "openai>=2.30.0",
    # Explicit: the GitHub forge adapter uses it directly. It reached runtime
    # only transitively through openai before, which is not a contract.
    "httpx>=0.28",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "cryptography>=42.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.6",
    # Starlette 1.3 TestClient prefers httpx2; plain httpx is deprecated.
    "httpx2",
    "coverage>=7.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]

[project.scripts]
praxis = "praxis_orchestrator.infra.cli.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["praxis_orchestrator"]
# The migration scripts are DATA, not modules, so hatchling would not ship them
# on its own — and an installed copy with no migrations cannot create its
# database at all (see praxis_orchestrator/infra/db/migration_config.py).
artifacts = [
    "praxis_orchestrator/infra/db/migrations/env.py",
    "praxis_orchestrator/infra/db/migrations/script.py.mako",
    "praxis_orchestrator/infra/db/migrations/versions/*.py",
    # The built UI, staged by scripts/build_frontend.sh. Git-ignored and absent
    # in a source checkout: the API serves it only when present, so a wheel
    # built without it is a working backend, not a broken install.
    "praxis_orchestrator/api/static/**/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Parallel by default, coverage on request.
#
# The integration suite spawns real servers, real agent CLIs and real git
# repositories, so it is bound by process startup and I/O rather than by this
# machine — exactly the shape that parallelises. Measured on 8 cores: unit
# 88s -> 12s, integration 257s -> 119s. It stops improving past about four
# workers, because what is left is a handful of tests that genuinely wait
# (`serve` booting an API and a worker, SSE polling), so `auto` is a ceiling
# rather than a target.
#
# Coverage came out of here because it is a 7-12% tax on every run, including
# the unit suite where nobody reads the report, and nothing gates on the
# number. `make coverage` still prints it.
#
# Debugging: `-n0` restores serial execution — `--pdb`
# needs it, and a crash is easier to read without interleaved workers.
#
# `--dist loadfile` keeps a file's tests inside ONE worker. That is not a
# balancing preference: the default round-robin ran four `praxis serve`
# tests simultaneously, each booting a real API and a real worker, and they
# knocked each other over. Per-file also imports each module once per worker
# instead of many times, which is where this suite's setup cost lives.
addopts = "-n auto --dist loadfile"
markers = [
    "integration: exercises real adapters (SQLite, git, subprocess); deselect with -m 'not integration'",
    "llm: cost-gated real-provider smoke tests; run explicitly with -m llm and REASONER_SMOKE_* set",
    "container: needs a working container runtime; deselect with -m 'not container'",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true

# Honest per-layer typing: praxis_orchestrator/domain and .../app are fully strict (the
# layers that claim it); the adapter layers carry explicit relaxations
# until they are brought up to strict. Ratchet rule: `mypy praxis_orchestrator` must stay
# at zero errors under this config — tighten flags here, never loosen.
# TODO(type-health): remove these overrides module by module.
[[tool.mypy.overrides]]
module = ["praxis_orchestrator.infra.*", "praxis_orchestrator.api.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_any_generics = false
disallow_untyped_calls = false
disallow_untyped_decorators = false
warn_return_any = false

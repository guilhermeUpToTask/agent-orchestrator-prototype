[project]
name = "agent-orchestrator"
version = "0.1.0"
description = "Local-first, human-gated, verified multi-agent coding orchestrator"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "agent-orchestrator contributors" }]
keywords = ["ai", "agents", "orchestration", "code-generation", "cli"]
classifiers = [
    # Preview, not production: the runtime is unsandboxed and the API's auth is
    # a single shared token. SECURITY.md states the posture plainly.
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
    "Environment :: Console",
]
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "gitpython>=3.1",
    "click>=8.1",
    "structlog>=24.0",
    "openai>=2.30.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "cryptography>=42.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    # Starlette 1.3 TestClient prefers httpx2; plain httpx is deprecated.
    "httpx2",
    "coverage>=7.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]

[project.scripts]
orchestrate = "agent_orchestrator.infra.cli.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_orchestrator"]
# The migration scripts are DATA, not modules, so hatchling would not ship them
# on its own — and an installed copy with no migrations cannot create its
# database at all (see agent_orchestrator/infra/db/migration_config.py).
artifacts = [
    "agent_orchestrator/infra/db/migrations/env.py",
    "agent_orchestrator/infra/db/migrations/script.py.mako",
    "agent_orchestrator/infra/db/migrations/versions/*.py",
    # The built UI, staged by scripts/build_frontend.sh. Git-ignored and absent
    # in a source checkout: the API serves it only when present, so a wheel
    # built without it is a working backend, not a broken install.
    "agent_orchestrator/api/static/**/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=agent_orchestrator --cov-report=term-missing"
markers = [
    "integration: exercises real adapters (SQLite, git, subprocess); deselect with -m 'not integration'",
    "llm: cost-gated real-provider smoke tests; run explicitly with -m llm and REASONER_SMOKE_* set",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true

# Honest per-layer typing: agent_orchestrator/domain and .../app are fully strict (the
# layers that claim it); the adapter layers carry explicit relaxations
# until they are brought up to strict. Ratchet rule: `mypy agent_orchestrator` must stay
# at zero errors under this config — tighten flags here, never loosen.
# TODO(type-health): remove these overrides module by module.
[[tool.mypy.overrides]]
module = ["agent_orchestrator.infra.*", "agent_orchestrator.api.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_any_generics = false
disallow_untyped_calls = false
disallow_untyped_decorators = false
warn_return_any = false

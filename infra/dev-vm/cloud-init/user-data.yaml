#cloud-config
users:
  - name: dev
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    lock_passwd: true
    ssh_authorized_keys:
      - SSH_PUBKEY_PLACEHOLDER

package_update: true
packages:
  - git
  - curl
  - build-essential
  - python3
  - python3-pip
  - python3-venv
  - podman
  - buildah
  - crun
  - docker.io
  - bubblewrap
  - uidmap
  - slirp4netns
  - fuse-overlayfs
  - jq
  # Chromium's shared-library closure, for `npm run test:e2e`. Playwright ships
  # the browser BINARY but not the system libraries it links against, so a
  # guest without these fails at launch with
  # `libatk-1.0.so.0: cannot open shared object file` — which reads like a
  # broken test suite and is a missing package. Reproduced on a built guest
  # 2026-08-10, when Phase 9's first browser run went 6-for-6 red.
  # Kept as an explicit list rather than `npx playwright install-deps` because
  # that command needs sudo at a point where cloud-init is the only root we
  # have, and because a named list is reviewable.
  - libatk1.0-0t64
  - libatk-bridge2.0-0t64
  - libcups2t64
  - libdrm2
  - libxkbcommon0
  - libxcomposite1
  - libxdamage1
  - libxfixes3
  - libxrandr2
  - libgbm1
  - libpango-1.0-0
  - libcairo2
  - libasound2t64
  - libatspi2.0-0t64
  - libnspr4
  - libnss3

write_files:
  - path: /etc/profile.d/praxis.sh
    content: |
      export PRAXIS_HOME="$HOME/.praxis"
  - path: /etc/sysctl.d/60-praxis-userns.conf
    content: |
      # Ubuntu 24.04 ships kernel.apparmor_restrict_unprivileged_userns=1, which
      # stops bwrap and unshare creating an unprivileged user namespace from a
      # plain shell. Podman and docker are unaffected — Ubuntu ships AppArmor
      # profiles permitting them — so the symptom is a guest that runs
      # PID-isolated containers fine while verify.sh's bwrap/unshare checks fail
      # with "setting up uid map: Permission denied", which reads exactly like a
      # kernel wall and is not one.
      #
      # The orchestrator's Sandbox port and the Codex/Pi CLIs both need
      # unprivileged userns. Disabling this is sound HERE and only here: the VM
      # boundary is what contains agent-written code, which is the whole reason
      # this guest replaced the devcontainer. The host kernel is untouched.
      kernel.apparmor_restrict_unprivileged_userns = 0

runcmd:
  - sysctl --system
  - usermod -aG docker dev
  - grep -q '^dev:' /etc/subuid || usermod --add-subuids 100000-165535 --add-subgids 100000-165535 dev
  - systemctl enable --now docker
  - loginctl enable-linger dev
  - curl -LsSf https://astral.sh/uv/install.sh | env UV_INSTALL_DIR=/usr/local/bin sh
  - curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
  - apt-get install -y nodejs
  - npm install -g @anthropic-ai/claude-code @openai/codex
  - su - dev -c 'mkdir -p ~/.praxis'

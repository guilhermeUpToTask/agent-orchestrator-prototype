[project]
name = "sitegen"
version = "0.1.0"
description = "A tiny static site generator: markdown in, HTML out."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
sitegen = "sitegen.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

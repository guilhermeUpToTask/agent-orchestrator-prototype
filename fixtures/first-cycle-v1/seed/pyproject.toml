[project]
name = "first-cycle"
version = "0.1.0"
description = "Disposable target repository for the first-cycle-v1 walkthrough."
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

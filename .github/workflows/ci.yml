name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  codex-plugin:
    name: Codex plugin
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate repository skills, tools, and agents
        run: python plugins/praxis-orchestrator-codex/scripts/validate.py

  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras --dev --locked

      - name: Ruff
        run: uv run ruff check praxis_orchestrator tests

      - name: Mypy typing ratchet
        run: uv run mypy praxis_orchestrator

      - name: Unit tests
        run: uv run pytest -q tests/unit

      - name: Integration tests
        run: uv run pytest -q tests/integration

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
          python-version: "3.12"

      - name: Install backend dependencies for OpenAPI export
        working-directory: backend
        run: uv sync --all-extras --dev --locked

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck and build
        run: npm run build

      # These existed but had never run in CI: the Phase 5 API-contract tests,
      # the plan-truth derivations and the settings interaction tests all
      # verified locally and nowhere else.
      - name: Frontend tests
        run: npm run test

      # The browser smoke answers the one question nothing else can: does the
      # bundle the wheel ships actually BOOT? `curl` returns 200 for a shell
      # whose JavaScript throws on the first line. On its first run it caught
      # the packaged UI calling a hardcoded http://localhost:8000 regardless of
      # the port `serve` was given — a defect that would have shipped in a
      # release and made the console load with nothing in it working.
      - name: Stage the UI into the package
        run: ../backend/scripts/build_frontend.sh

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Packaged UI browser smoke
        run: npm run test:e2e
        env:
          E2E_PYTHON: ${{ github.workspace }}/backend/.venv/bin/python

      # The full-cycle suite: an operator driving a brief all the way to a
      # published cycle in the browser. Added 2026-08-10 as Phase 9's first
      # act, and it is the first test in this repository ever to drive the
      # console through a plan — CLAUDE.md claimed this was "Phase 8" from
      # Phase 6 onward and Phase 8 came and went without it, so every claim
      # that the UI worked was inference from unit tests.
      #
      # Tier 0 (stub reasoner + dry-run runner), so it is deterministic and
      # costs nothing: the whole cycle completes in seconds. It is also the
      # safety net the Phase 9 refactor rests on, which is why it runs here
      # rather than only on a developer's machine.
      - name: Full-cycle browser E2E
        run: npm run test:e2e:cycle
        env:
          E2E_PYTHON: ${{ github.workspace }}/backend/.venv/bin/python

      # The suite captures every major surface in both themes (P9 task 5).
      # `e2e/screenshots/` is git-ignored — they are regenerated, never
      # hand-made — so this is how a reviewer sees them without running
      # anything. Uploaded on failure too: a red run's screenshots are the
      # most useful ones.
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: console-screenshots
          path: frontend/e2e/screenshots/
          if-no-files-found: warn
          retention-days: 14
          E2E_HOME: ${{ runner.temp }}/praxis-e2e-home

      - name: Regenerate API types
        run: |
          export PATH="${{ github.workspace }}/backend/.venv/bin:$PATH"
          npm run generate:api

      - name: Verify generated API types are current
        run: |
          if ! git diff --exit-code -- openapi.json src/types/generated; then
            echo "::error::Generated API types are stale. Run 'cd frontend && npm run generate:api' and commit the results."
            exit 1
          fi
